# OpenConnector — open-source connector gateway (oomol-lab/open-connector)
# Exposes 1000+ providers via HTTP + MCP at :3000 (/mcp).
services:
  open-connector:
    image: ghcr.io/oomol-lab/open-connector:latest
    container_name: artex-open-connector
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - open_connector_data:/app/data
    environment:
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ORIGIN: ${OOMOL_CONNECT_ORIGIN:-http://127.0.0.1:3000}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:?set encryption key}
      # Empty = open local auth (recommended for ARTEX). Set tokens + OPEN_CONNECTOR_SECURE=1 for lock-down.
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:-}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:-}

volumes:
  open_connector_data:
